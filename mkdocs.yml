site_name: Avaliação de Qualidade do VICKY
site_description: Avaliação da qualidade do produto VICKY - FGA0315 Qualidade de Software 1 - 2026.2 - T02 - Frances Allen
site_author: Grupo Frances Allen
site_url: https://fcte-qualidade-de-software-1.github.io/2026-2_T02_FRANCES_ALLEN/
repo_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_FRANCES_ALLEN
repo_name: 2026-2_T02_FRANCES_ALLEN
edit_uri: edit/main/docs/

# Rodapé com versão e data (critério GitPage da rubrica)
copyright: "FGA0315 Qualidade de Software 1 - 2026.2 - T02 - Grupo Frances Allen | Documentação v0.2 - 05/10/2026"

theme:
  name: material
  language: pt-BR
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    # Barra lateral esquerda com toda a navegação (sem abas no topo)
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.action.edit

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: pt
  - git-revision-date-localized:
      enabled: !ENV [GIT_DATES, true]  # local sem commits: GIT_DATES=false mkdocs serve
      type: date
      locale: pt
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Início: index.md
  - O projeto:
      - projeto/index.md
      - Objeto de avaliação: projeto/objeto-de-avaliacao.md
      - Equipe: projeto/equipe.md
      - Declaração de uso de IA: projeto/uso-de-ia.md
      - Identidade visual: projeto/identidade-visual.md
  - "Premissa 1 - Características":
      - premissa-1-caracteristicas/index.md
      - Seleção e justificativa: premissa-1-caracteristicas/selecao.md
      - Relações entre características: premissa-1-caracteristicas/relacoes.md
  - "Premissa 2 - Métricas (GQM)":
      - premissa-2-metricas/index.md
      - Objetivos, questões e hipóteses: premissa-2-metricas/objetivos-questoes-hipoteses.md
      - Especificação das métricas: premissa-2-metricas/especificacao-das-metricas.md
      - Níveis de pontuação e julgamento: premissa-2-metricas/niveis-e-julgamento.md
      - Diagrama GQM: premissa-2-metricas/diagrama-gqm.md
  - "Premissa 3 - Gestão (PSM/CID)":
      - premissa-3-gestao/index.md
      - Plano de medição da gestão: premissa-3-gestao/plano-de-medicao.md
      - Registro de medições: premissa-3-gestao/registro-de-medicoes.md
      - Decisões de gestão: premissa-3-gestao/decisoes.md
  - Atas: atas/index.md
  - Referências: referencias.md
