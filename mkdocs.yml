site_name: Avaliação de Qualidade do VICKY
site_description: Avaliação da qualidade do produto VICKY - FGA0315 Qualidade de Software 1 - 2026.2 - T02 - Frances Allen
site_author: Grupo Frances Allen
site_url: https://fcte-qualidade-de-software-1.github.io/2026-2_T02_FRANCES_ALLEN/
repo_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_FRANCES_ALLEN
repo_name: 2026-2_T02_FRANCES_ALLEN
edit_uri: edit/main/docs/

# Rodapé com versão e data (critério GitPage da rubrica)
copyright: "FGA0315 Qualidade de Software 1 - 2026.2 - T02 - Grupo Frances Allen | Documentação v0.3 - 16/10/2026"

theme:
  name: material
  language: pt-BR
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    # Abas no topo = fases do processo de avaliação (ISO/IEC 25040);
    # a barra lateral esquerda mostra apenas as páginas da aba selecionada
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.action.edit

# Rascunhos de entregas futuras: ficam no repositório, mas não são publicados
exclude_docs: |
  rascunhos/

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: pt
  - git-revision-date-localized:
      enabled: !ENV [GIT_DATES, true]  # local sem commits: GIT_DATES=false mkdocs serve
      type: date
      locale: pt
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Início: index.md
  - "Fase 1":
      - fase-1/index.md
      - Propósito da avaliação: fase-1/proposito.md
      - Requisitante e partes interessadas: fase-1/partes-interessadas.md
      - Objeto de avaliação: fase-1/objeto-de-avaliacao.md
      - Modelo de qualidade: fase-1/modelo-de-qualidade.md
      - Seleção e priorização das características: fase-1/caracteristicas.md
      - Escopo e profundidade: fase-1/escopo.md
      - ODS relacionados: fase-1/ods.md
  - "Fase 2":
      - fase-2/index.md
      - Objetivos, questões e hipóteses: fase-2/objetivos-questoes-hipoteses.md
      - Especificação das métricas: fase-2/especificacao-das-metricas.md
      - Níveis de pontuação e julgamento: fase-2/niveis-e-julgamento.md
      - Diagrama GQM: fase-2/diagrama-gqm.md
  - "Fase 3": fase-3/index.md
  - "Fase 4": fase-4/index.md
  - Gestão do projeto:
      - gestao/index.md
      - Plano de medição: gestao/plano-de-medicao.md
      - Registro de medições: gestao/registro-de-medicoes.md
      - Decisões de gestão: gestao/decisoes.md
      - Atas de reunião: gestao/atas.md
  - Sobre:
      - sobre/index.md
      - Equipe: sobre/equipe.md
      - Declaração de uso de IA: sobre/uso-de-ia.md
      - Identidade visual: sobre/identidade-visual.md
      - Referências: sobre/referencias.md
